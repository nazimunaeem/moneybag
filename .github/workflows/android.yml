name: MoneyBag Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build & Sign APK / AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 4. Restore google-services.json from secret ────────────────────────
      #   In GitHub → Settings → Secrets → Actions, add:
      #     GOOGLE_SERVICES_JSON  (paste the full content of google-services.json)
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json

      # ── 5. Restore keystore from secret ────────────────────────────────────
      #   Encode your keystore:  base64 -i release.jks | pbcopy
      #   Then add these GitHub secrets:
      #     KEYSTORE_BASE64       (base64-encoded .jks file)
      #     KEYSTORE_PASSWORD     (store password)
      #     KEY_ALIAS             (key alias)
      #     KEY_PASSWORD          (key password)
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      # ── 6. Make gradlew executable ─────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ── 7. Build signed release APK ────────────────────────────────────────
      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 8. Build signed release AAB (Play Store) ───────────────────────────
      - name: Build signed release AAB
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 9. Upload APK artifact ─────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyBag-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # ── 10. Upload AAB artifact ────────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoneyBag-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # ── 11. Create GitHub Release on version tag push ─────────────────────
      #   Push a tag like v1.2.3 to trigger a release:
      #     git tag v1.2.3 && git push origin v1.2.3
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
