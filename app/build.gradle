plugins {
    id("com.android.application")
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

android {
    namespace 'com.moneybag.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.bd.nazim.moneybag"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ── Signing config reads from env vars set by GitHub Actions ──────────
    signingConfigs {
        release {
            // Fallback gracefully if env vars absent (local dev uses debug key)
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: ""
            def keystorePass = System.getenv("KEYSTORE_PASSWORD") ?: ""
            def keyAlias     = System.getenv("KEY_ALIAS") ?: ""
            def keyPass      = System.getenv("KEY_PASSWORD") ?: ""

            if (keystorePath && keystorePass && keyAlias && keyPass) {
                storeFile     file("${keystorePath}")
                storePassword keystorePass
                keyAlias      keyAlias
                keyPassword   keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:34.12.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // NanoHTTPD
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:25.2.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // WorkManager
    implementation 'androidx.work:work-runtime:2.9.0'
}
